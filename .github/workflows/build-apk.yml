name: Build KRIPTIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -e
          echo "Checking Android SDK..."
          test -d "$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK command-line tools not found."
            echo "SDK location: $ANDROID_HOME"
            ls -la "$ANDROID_HOME"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "Found SDK manager: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project structure
        shell: bash
        run: |
          set -e
          cd KRIPTIC-Android
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          echo "Android project files found."
          echo "Project structure:"
          ls -la

      - name: Build debug APK
        shell: bash
        run: |
          cd KRIPTIC-Android
          gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK_PATH="KRIPTIC-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK build successful."

      - name: Upload KRIPTIC APK
        uses: actions/upload-artifact@v4
        with:
          name: KRIPTIC-debug-APK
          path: KRIPTIC-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
